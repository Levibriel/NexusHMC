<!-- app/static/components/header.html -->
<header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-2.5 flex flex-col sm:flex-row items-center justify-between gap-3 z-10 flex-shrink-0 shadow-sm">
    <div class="flex items-center space-x-2.5 w-full sm:w-auto justify-between sm:justify-start">
        <button onclick="toggleSidebar()" class="text-slate-600 dark:text-slate-300 hover:text-hmcYellow p-1 rounded-md transition hidden md:block">
            <i data-lucide="panel-left" class="w-5 h-5"></i>
        </button>
        <span id="current-view-title" class="text-sm md:text-base font-bold text-hmcBlue dark:text-white tracking-tight font-sans">Monitoreo Hora a Hora</span>
        <span class="bg-blue-50 dark:bg-blue-950/50 text-blue-700 dark:text-blue-300 text-[11px] font-semibold px-2 py-0.5 rounded-full border border-blue-200 dark:border-blue-900 flex-shrink-0 font-sans">Fase 15 B •</span>
    </div>

    <!-- Selector de Turno y Fecha -->
    <div class="flex flex-wrap items-center gap-2 bg-slate-50 dark:bg-slate-800/60 p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 w-full sm:w-auto">
        <div class="flex items-center space-x-1 px-1.5">
            <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-400"></i>
            <input type="date" id="query-date" class="bg-transparent text-[11px] font-semibold text-slate-700 dark:text-slate-200 focus:outline-none">
        </div>
        <div class="h-3 w-px bg-slate-300 dark:bg-slate-700"></div>
        <div class="flex items-center space-x-1 px-1.5">
            <label class="text-[10px] font-bold text-slate-500 uppercase">Turno:</label>
            <select id="query-shift" class="bg-transparent text-[11px] font-semibold text-hmcBlue dark:text-amber-400 focus:outline-none cursor-pointer">
                <option value="A" selected>Turno A</option>
                <option value="B">Turno B</option>
                <option value="BOTH">Turno A + B</option>
            </select>
        </div>
        <button id="btn-load-data" onclick="loadShiftData()" class="bg-hmcBlue dark:bg-amber-400 dark:text-hmcDark hover:bg-[#07182E] text-white px-2.5 py-1 rounded-md text-[11px] font-bold transition shadow-sm flex items-center space-x-1.5 min-w-[75px] justify-center">
            <i data-lucide="refresh-cw" id="btn-load-icon" class="w-3 h-3"></i>
            <span id="btn-load-text">Cargar</span>
        </button>
    </div>

    <!-- Controles y Monitoreo de Freshness de BD -->
    <div class="hidden xl:flex items-center space-x-2">
        <div class="flex items-center space-x-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md px-2.5 py-1 text-[11px] text-slate-600 dark:text-slate-300 font-medium font-sans">
            <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i>
            <span id="live-clock">--:--:--</span>
        </div>
        <div class="flex items-center space-x-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md px-2.5 py-1 text-[11px] text-slate-600 dark:text-slate-300 font-medium font-sans" title="Última sincronización con PostgreSQL R4M">
            <i data-lucide="database" class="w-3.5 h-3.5 text-amber-400"></i>
            <span>Última Actualización: <strong id="last-db-update" class="text-slate-800 dark:text-white font-bold">--:--:--</strong></span>
        </div>
    </div>
</header>
