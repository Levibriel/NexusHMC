<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus HMC | Michilla</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        hmcBlue: '#0B2545',
                        hmcYellow: '#FFC800',
                        hmcDark: '#07182E',
                        hmcAccent: '#134074',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen flex flex-col md:flex-row transition-colors duration-300">

    <!-- Barra de carga superior -->
    <div id="top-progress-bar" class="fixed top-0 left-0 h-1 bg-amber-400 z-50 transition-all duration-300 w-0 opacity-0 shadow-[0_0_8px_#FFC800]"></div>

    <!-- Contenedor del Sidebar Global -->
    <div id="sidebar-container"></div>

    <!-- Contenido Principal -->
    <main id="main-container" class="flex-1 flex flex-col min-h-screen overflow-y-auto bg-slate-100 dark:bg-slate-950 md:ml-64 transition-all duration-300">
        
        <!-- Contenedor del Header Global -->
        <div id="header-container"></div>

        <!-- Área donde se inyecta la Vista Activa (Monitoreo Hora a Hora / Período) -->
        <div class="p-3 md:p-4 flex flex-col gap-4" id="main-content-area"></div>

    </main>

    <!-- Scripts Modulares -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/loader.js"></script>
    <script src="/static/js/horahora.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
